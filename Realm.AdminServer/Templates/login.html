<!DOCTYPE html>
<html>
<head>
    <title>Authorize Realm</title>
    <style>
        body {
            background: #0f111a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1d2e;
            border: 2px solid #3b3f5c;
            border-radius: 12px;
            padding: 40px;
            width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h2 {
            color: #ffd700;
            margin-bottom: 10px;
        }
        .provider-title {
            text-transform: capitalize;
            font-weight: bold;
            color: #5cd6ff;
        }
        .btn {
            background: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 20px;
        }
        .btn-steam {
            background: #171a21;
            border: 1px solid #66c0f4;
        }
        .btn:hover {
            filter: brightness(1.1);
        }
        input {
            width: 90%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 4px;
            border: 1px solid #3b3f5c;
            background: #0f111a;
            color: #e2e8f0;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Authorize Realm</h2>
        <p>Connect your <span class="provider-title">{{provider}}</span> account to play.</p>
        <form action="/auth/authorize" method="GET">
            <input type="hidden" name="provider" value="{{provider}}" />
            <input type="hidden" name="port" value="{{port}}" />
            <input type="text" name="username" placeholder="Enter Username" required value="Gamer_{{random_number}}" />
            {{discord_input}}
            <button type="submit" class="btn {{button_class}}">
                Login with {{provider}}
            </button>
        </form>
    </div>
</body>
</html>
